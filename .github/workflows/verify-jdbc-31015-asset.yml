name: Verify published JDBC 3.10.15 asset
on:
  push:
    branches: [codex/jdbc-published-artifact-check-20261019]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Download and verify the public release artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYCODE'
          import datetime, hashlib, json, pathlib, struct, subprocess, zipfile
          repo = "aliyun/aliyun-odps-jdbc"
          tag = "v3.10.15"
          commit = "f79f20b88b201ade4a252fbd1dc707a81948ab2c"
          expected = "cbf3778a77d9447c4fc89e2e3dfd81fe1b717bc2b45d523b37f34705108e22f0"
          def api(path):
              return json.loads(subprocess.check_output(["gh", "api", "repos/" + repo + "/" + path], text=True))
          ref = api("git/ref/tags/" + tag)
          assert ref["object"]["type"] == "commit" and ref["object"]["sha"] == commit
          release = api("releases/tags/" + tag)
          assert not release["draft"] and not release["prerelease"]
          assert api("releases/latest")["id"] == release["id"]
          name = "odps-jdbc-3.10.15.jar"
          asset = next(a for a in release["assets"] if a["name"] == name)
          assert asset["digest"] == "sha256:" + expected
          subprocess.run(["gh", "release", "download", tag, "--repo", repo, "--pattern", name, "--dir", "released-driver"], check=True)
          jar = pathlib.Path("released-driver") / name
          actual = hashlib.sha256(jar.read_bytes()).hexdigest()
          assert actual == expected and jar.stat().st_size == asset["size"]
          with zipfile.ZipFile(jar) as z:
              names = z.namelist()
              assert b"version=3.10.15" in z.read("maxcompute-version.properties")
              classes = [n for n in names if n.startswith("com/aliyun/odps/jdbc/") and not n.startswith("com/aliyun/odps/jdbc/shaded/") and n.endswith(".class")]
              assert classes
              majors = sorted({struct.unpack(">H", z.read(n)[6:8])[0] for n in classes})
              assert majors == [52]
              assert not any(n.startswith(("org/junit/", "org/mockito/", "org/hamcrest/", "org/opentest4j/")) for n in names)
          result = {"passed": True, "commit": commit, "tag": tag, "jar_sha256": actual,
                    "jar_bytes": jar.stat().st_size, "driver_classes": len(classes), "class_majors": majors,
                    "test_dependency_classes": 0, "release_url": release["html_url"],
                    "download_url": asset["browser_download_url"], "downloaded": True,
                    "scope": "public GitHub download, integrity and Java 8 package checks; live SQL is separate",
                    "real_service": False, "observed_at": datetime.datetime.now(datetime.timezone.utc).isoformat()}
          pathlib.Path("released-asset-verification.json").write_text(json.dumps(result, indent=2) + "\n")
          print(json.dumps(result))
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: published-driver-verification
          path: released-asset-verification.json
          if-no-files-found: error
